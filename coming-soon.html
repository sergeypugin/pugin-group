<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Раздел в разработке — ИП Евгений Пугин</title>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .stub-wrapper {
          min-height: calc(100vh - 72px - 280px);
          display: flex; flex-direction: column; align-items: center;
          justify-content: center; text-align: center; padding: 60px 24px;
        }
        .stub-icon { font-size: 48px; margin-bottom: 16px; }
        .stub-title { font-size: 32px; font-weight: 800; margin-bottom: 12px; }
        .stub-text { color: var(--text-muted); font-size: 16px; max-width: 500px; margin-bottom: 28px; }
    </style>
</head>
<body>

<!-- Модульная шапка -->
<div id="header-placeholder"></div>

<main class="stub-wrapper">
    <div class="stub-icon"></div>
    <h1 class="stub-title">Раздел в разработке</h1>
    <p class="stub-text">Мы наполняем этот раздел подробной информацией. Напишите нам или позвоните, чтобы получить консультацию уже сейчас.</p>
    <a href="index.html" class="btn-cta">
  <span class="btn-cta__icon">
    <svg viewBox="0 0 14 15" fill="none" class="icon-svg" width="10">
      <path d="M13.376 11.552l-.264-10.44-10.44-.24.024 2.28 6.96-.048L.2 12.56l1.488 1.488 9.432-9.432-.048 6.912 2.304.024z" fill="currentColor"></path>
    </svg>
    <svg viewBox="0 0 14 15" fill="none" width="10" class="icon-svg icon-svg--copy">
      <path d="M13.376 11.552l-.264-10.44-10.44-.24.024 2.28 6.96-.048L.2 12.56l1.488 1.488 9.432-9.432-.048 6.912 2.304.024z" fill="currentColor"></path>
    </svg>
  </span>
  Вернуться на главную
</a>
</main>

<!-- Модульный футер -->
<div id="footer-placeholder"></div>

<!-- Динамическая кнопка наверх -->
<div id="back-to-top-placeholder"></div>

<script src="script.js"></script>
</body>
</html>
