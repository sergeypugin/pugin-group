<!DOCTYPE html>
<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .stub-wrapper {
          min-height: calc(100vh - 72px - 200px);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 60px 24px;
        }
        .stub-icon {
          font-size: 48px;
          margin-bottom: 16px;
        }
        .stub-title {
          font-size: 32px;
          font-weight: 800;
          margin-bottom: 12px;
        }
        .stub-text {
          color: var(--text-muted);
          font-size: 16px;
          max-width: 500px;
          margin-bottom: 28px;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="container header__container">
        <a href="index.html" class="logo">
            <span class="brand-ip">ИП</span>
            <span class="brand-name">Евгений Пугин</span>
        </a>
        <a href="index.html#contacts" class="btn-cta">Связаться</a>
    </div>
</header>

<main class="stub-wrapper">
    <div class="stub-icon"></div>
    <h1 class="stub-title">Раздел в разработке</h1>
    <p class="stub-text">Мы наполняем этот раздел подробной информацией. Напишите нам или позвоните, чтобы получить консультацию уже сейчас.</p>
    <a href="index.html" class="btn-cta" style="background-color: var(--indigo); color: #fff;">Вернуться на главную &rarr;</a>

<footer class="footer">
    <div class="container footer-copyright">
        © 2026 ИП Евгений Пугин. Все права защищены.
    </div>
</footer>

</html>
