<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка организации | ИП Евгений Пугин</title>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header-placeholder"></div>

<main class="container page-content">
    <!-- Хлебные крошки -->
    <nav class="breadcrumbs">
        <a href="index.html">Главная</a>
        <span class="breadcrumbs__sep">/</span>
        <span class="breadcrumbs__current">Карточка организации</span>
    </nav>

    <div class="company-card">
        <div class="company-card__header">
            <div>
                <h1 class="company-card__title">Карточка организации</h1>
            </div>
            <div class="card-actions">
                <button class="Btn Btn--pdf" id="btn-export-pdf" type="button" aria-label="Скачать PDF">
                    <svg class="svgIcon" viewBox="0 0 384 512">
                        <path d="M169.4 470.6c12.5 12.5 32.8 12.5 45.3 0l160-160c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L224 370.8 224 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 306.7L54.6 265.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l160 160z"></path>
                    </svg>
                    <span class="icon2"></span>
                    <span class="tooltip">PDF</span>
                </button>

                <button class="Btn Btn--docx" id="btn-export-docx" type="button" aria-label="Скачать DOCX">
                    <svg class="svgIcon" viewBox="0 0 384 512">
                        <path d="M169.4 470.6c12.5 12.5 32.8 12.5 45.3 0l160-160c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L224 370.8 224 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 306.7L54.6 265.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l160 160z"></path>
                    </svg>
                    <span class="icon2"></span>
                    <span class="tooltip">DOCX</span>
                </button>

                <button class="Btn Btn--copy" id="btn-copy-data" type="button" aria-label="Скопировать">
                    <svg class="svgIcon" viewBox="0 0 448 512">
                        <path d="M384 336H192c-8.8 0-16-7.2-16-16V64c0-8.8 7.2-16 16-16l140.1 0L384 99.9V320c0 8.8-7.2 16-16 16zM192 0c-35.3 0-64 28.7-64 64V320c0 35.3 28.7 64 64 64H384c35.3 0 64-28.7 64-64V99.9c0-17-6.7-33.3-18.7-45.3L381.3 18.7C369.3 6.7 353 0 336 0H192zM64 128c-35.3 0-64 28.7-64 64V448c0 35.3 28.7 64 64 64H256c35.3 0 64-28.7 64-64V416H272v32c0 8.8-7.2 16-16 16H64c-8.8 0-16-7.2-16-16V192c0-8.8 7.2-16 16-16H96V128H64z"></path>
                    </svg>
                    <span class="icon2"></span>
                    <span class="tooltip" id="copy-tooltip">Скопировать</span>
                </button>
            </div>
        </div>

        <div id="company-card-body"></div>
    </div>
</main>

<!-- Единый источник данных и логика -->
<script src="company-data.js"></script>
<script src="script.js"></script>

<!-- Динамический футер -->
<div id="footer-placeholder"></div>

<!-- Динамическая кнопка наверх -->
<div id="back-to-top-placeholder"></div>

<!-- Предупреждение об использовании файлов Cookie -->
<div id="cookie-placeholder"></div>

</body>
</html>
