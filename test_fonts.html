<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Динамический просмотр шрифтов</title>
    <style>
        body {
          font-family: system-ui, -apple-system, sans-serif;
          background-color: #121212;
          color: #e0e0e0;
          margin: 0;
          padding: 40px 20px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .container {
          max-width: 1200px;
          width: 100%;
        }

        h1 {
          margin-bottom: 24px;
          font-weight: 600;
          color: #ffffff;
          text-align: center;
        }

        .controls {
          margin-bottom: 30px;
          background: #1e1e1e;
          padding: 20px;
          border-radius: 12px;
          box-shadow: 0 4px 20px rgba(0,0,0,0.3);
          display: flex;
          flex-direction: column;
          gap: 16px;
        }

        .file-input-wrapper {
          display: flex;
          align-items: center;
          gap: 12px;
          background: #2a2a2a;
          padding: 12px;
          border-radius: 8px;
          border: 1px dashed #555;
        }

        input[type="file"] {
          color: #ccc;
        }

        .text-input-wrapper label {
          display: block;
          margin-bottom: 8px;
          font-size: 14px;
          color: #aaa;
        }

        .text-input-wrapper input {
          width: 100%;
          padding: 12px 16px;
          background: #2a2a2a;
          border: 1px solid #444;
          border-radius: 8px;
          color: #fff;
          font-size: 16px;
          box-sizing: border-box;
          outline: none;
        }

        .text-input-wrapper input:focus {
          border-color: #4f46e5;
        }

        .font-table {
          width: 100%;
          border-collapse: separate;
          border-spacing: 0;
          background: #1e1e1e;
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .font-table th,
        .font-table td {
          padding: 20px;
          text-align: left;
          border-bottom: 1px solid #2d2d2d;
        }

        .font-table th {
          background-color: #252525;
          color: #888;
          font-weight: 500;
          font-size: 13px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }

        .font-table tr:last-child td {
          border-bottom: none;
        }

        .font-name {
          width: 250px;
          font-family: monospace;
          font-size: 13px;
          color: #818cf8;
          word-break: break-all;
        }

        .font-sample {
          font-size: 20px;
          line-height: 1.5;
          color: #ffffff;
        }

        .empty-state {
          text-align: center;
          color: #666;
          padding: 40px !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Динамическое сравнение шрифтов</h1>

    <div class="controls">
        <div class="file-input-wrapper">
            <label for="folderInput" style="color: #aaa; font-size: 14px;">Выберите папку со шрифтами:</label>
            <input type="file" id="folderInput" webkitdirectory directory multiple>
        </div>

        <div class="text-input-wrapper">
            <label for="textInput">Текст для проверки:</label>
            <input type="text" id="textInput" value="Съешь ещё этих мягких французских булок! The quick brown fox jumps over the lazy dog. 1234567890 (?!:;,.-@#%)">
        </div>
    </div>

    <table class="font-table">
        <thead>
        <tr>
            <th>Файл шрифта</th>
            <th>Предпросмотр</th>
        </tr>
        </thead>
        <tbody id="tableBody">
        <tr>
            <td colspan="2" class="empty-state">Выберите папку с файлами шрифтов выше, чтобы построить таблицу</td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    const folderInput = document.getElementById('folderInput');
    const tableBody = document.getElementById('tableBody');
    const textInput = document.getElementById('textInput');

    folderInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      const fontFiles = files.filter(file => /\.(woff|woff2|ttf|otf)$/i.test(file.name));

      if (fontFiles.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="2" class="empty-state">Шрифты не найдены в выбранной папке</td></tr>';
        return;
      }

      tableBody.innerHTML = '';

      for (const file of fontFiles) {
        const fontName = 'font_' + Math.random().toString(36).substr(2, 9);
        const fontUrl = URL.createObjectURL(file);
        const fontFace = new FontFace(fontName, `url(${fontUrl})`);

        try {
          const loadedFont = await fontFace.load();
          document.fonts.add(loadedFont);

          const tr = document.createElement('tr');

          const tdName = document.createElement('td');
          tdName.className = 'font-name';
          tdName.textContent = file.name;

          const tdPreview = document.createElement('td');
          const sampleDiv = document.createElement('div');
          sampleDiv.className = 'font-sample preview-text';
          sampleDiv.style.fontFamily = `'${fontName}', sans-serif`;
          sampleDiv.textContent = textInput.value;

          tdPreview.appendChild(sampleDiv);
          tr.appendChild(tdName);
          tr.appendChild(tdPreview);
          tableBody.appendChild(tr);
        } catch (err) {
          console.error(err);
        }
      }
    });

    textInput.addEventListener('input', () => {
      const previews = document.querySelectorAll('.preview-text');
      previews.forEach(preview => {
        preview.textContent = textInput.value;
      });
    });
</script>

</body>
</html>
